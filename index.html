<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PT Muara Laboh Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>

:root{
  --bg:#07111f;
  --panel:#101d33;
  --panel2:#0c1627;
  --accent:#00c8ff;
  --accent2:#ff6a00;
  --green:#00ff99;
  --text:#eef6ff;
  --border:rgba(0,200,255,0.15);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Exo 2',sans-serif;
  overflow:hidden;
}

/* HEADER */

.header{
  height:80px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 20px;
  background:#0b1729;
  border-bottom:1px solid var(--border);
}

.title{
  font-family:'Rajdhani',sans-serif;
  font-size:28px;
  font-weight:700;
  color:var(--accent);
}

.subtitle{
  font-size:12px;
  opacity:0.7;
}

.clock{
  text-align:right;
}

.clock-time{
  font-size:34px;
  font-family:'Rajdhani',sans-serif;
  color:var(--accent);
}

.clock-date{
  font-size:12px;
  opacity:0.7;
}

/* TICKER */

.ticker{
  height:35px;
  overflow:hidden;
  white-space:nowrap;
  background:#081321;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
}

.ticker-text{
  display:inline-block;
  padding-left:100%;
  animation:marquee 25s linear infinite;
  color:var(--accent2);
  font-weight:600;
}

@keyframes marquee{
  0%{transform:translateX(0)}
  100%{transform:translateX(-100%)}
}

/* MAIN */

.main{
  display:grid;
  grid-template-columns:1.2fr 1.2fr 0.8fr;
  gap:10px;
  padding:10px;
  height:calc(100vh - 115px);
}

.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.panel-header{
  padding:10px 14px;
  background:rgba(0,200,255,0.08);
  border-bottom:1px solid var(--border);
  font-family:'Rajdhani',sans-serif;
  font-size:14px;
  letter-spacing:1px;
  color:var(--accent);
  font-weight:700;
}

/* PDF */

.pdf-container{
  flex:1;
  position:relative;
  background:#fff;
  overflow:hidden;
}

.pdf-canvas{
  width:100%;
  height:100%;
  object-fit:contain;
}

.upload-btn{
  position:absolute;
  top:10px;
  right:10px;
  z-index:10;
  background:var(--accent);
  color:#000;
  border:none;
  padding:6px 12px;
  border-radius:5px;
  cursor:pointer;
  font-weight:700;
}

input[type=file]{
  display:none;
}

/* RIGHT COLUMN */

.right-col{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.info-box{
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:16px;
}

.big-number{
  font-size:54px;
  font-family:'Rajdhani',sans-serif;
  color:var(--accent2);
  font-weight:700;
}

.small-label{
  font-size:12px;
  opacity:0.7;
  text-transform:uppercase;
}

/* WEATHER */

.weather-temp{
  font-size:42px;
  font-family:'Rajdhani',sans-serif;
  color:var(--green);
}

/* MEDIA */

.media-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.media-grid img{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  border-radius:6px;
}

/* MOBILE */

@media(max-width:900px){

  .main{
    grid-template-columns:1fr;
    overflow:auto;
    height:auto;
  }

}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

  <div>
    <div class="title">PT MUARA LABOH - 2</div>
    <div class="subtitle">Project Monitoring Dashboard</div>
  </div>

  <div class="clock">
    <div class="clock-time" id="clock">00:00:00</div>
    <div class="clock-date" id="date">-</div>
  </div>

</div>

<!-- TICKER -->

<div class="ticker">
  <div class="ticker-text">
    ⚡ SAFETY ALWAYS ⚡ QUALITY OKE ⚡ RACAK BANA ⚡ PROJECT DASHBOARD LIVE ⚡
  </div>
</div>

<!-- MAIN -->

<div class="main">

  <!-- PDF 1 -->

  <div class="panel">

    <div class="panel-header">
      Construction Highlight
    </div>

    <div class="pdf-container">

      <button class="upload-btn"
      onclick="document.getElementById('pdf1').click()">
      Upload PDF
      </button>

      <input type="file" id="pdf1" accept="application/pdf">

      <canvas id="canvas1" class="pdf-canvas"></canvas>

    </div>

  </div>

  <!-- PDF 2 -->

  <div class="panel">

    <div class="panel-header">
      HSE Highlight
    </div>

    <div class="pdf-container">

      <button class="upload-btn"
      onclick="document.getElementById('pdf2').click()">
      Upload PDF
      </button>

      <input type="file" id="pdf2" accept="application/pdf">

      <canvas id="canvas2" class="pdf-canvas"></canvas>

    </div>

  </div>

  <!-- RIGHT -->

  <div class="right-col">

    <div class="info-box">

      <div class="small-label">
        Project Running
      </div>

      <div class="big-number" id="days">
        0
      </div>

      <div class="small-label">
        Days
      </div>

    </div>

    <div class="info-box">

      <div class="small-label">
        Weather
      </div>

      <div class="weather-temp">
        29°C
      </div>

      <div>
        Solok Selatan
      </div>

      <div style="opacity:0.7;margin-top:4px;">
        Cloudy
      </div>

    </div>

    <div class="info-box">

      <div class="small-label" style="margin-bottom:10px;">
        Site Photos
      </div>

      <div class="media-grid">

        <img src="https://picsum.photos/400/200?1">
        <img src="https://picsum.photos/400/200?2">
        <img src="https://picsum.photos/400/200?3">
        <img src="https://picsum.photos/400/200?4">

      </div>

    </div>

  </div>

</div>

<script>

/* CLOCK */

function updateClock(){

  const now = new Date();

  document.getElementById('clock').innerText =
    now.toLocaleTimeString('id-ID');

  document.getElementById('date').innerText =
    now.toLocaleDateString('id-ID',{
      weekday:'long',
      year:'numeric',
      month:'long',
      day:'numeric'
    });

}

setInterval(updateClock,1000);

updateClock();

/* PROJECT DAYS */

const startDate = new Date('2025-01-24');

const today = new Date();

const diff = Math.floor(
  (today-startDate)/(1000*60*60*24)
);

document.getElementById('days').innerText = diff;

/* PDF.JS */

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function setupPDF(inputId, canvasId){

  let pdfDoc = null;

  let currentPage = 1;

  const input = document.getElementById(inputId);

  const canvas = document.getElementById(canvasId);

  const ctx = canvas.getContext('2d');

  input.addEventListener('change', async function(e){

    const file = e.target.files[0];

    if(!file) return;

    const url = URL.createObjectURL(file);

    pdfDoc = await pdfjsLib.getDocument(url).promise;

    renderPage(currentPage);

    setInterval(async ()=>{

      if(!pdfDoc) return;

      currentPage++;

      if(currentPage > pdfDoc.numPages){
        currentPage = 1;
      }

      renderPage(currentPage);

    },10000);

  });

  async function renderPage(num){

    const page = await pdfDoc.getPage(num);

    const viewport = page.getViewport({
      scale:1.6
    });

    canvas.height = viewport.height;

    canvas.width = viewport.width;

    await page.render({
      canvasContext:ctx,
      viewport:viewport
    }).promise;

  }

}

setupPDF('pdf1','canvas1');

setupPDF('pdf2','canvas2');

/* AUTO REFRESH */

setInterval(()=>{

  location.reload();

},300000);

/* FULLSCREEN */

document.addEventListener('dblclick',()=>{

  if(!document.fullscreenElement){

    document.documentElement.requestFullscreen();

  }else{

    document.exitFullscreen();

  }

});

</script>

</body>
</html>
